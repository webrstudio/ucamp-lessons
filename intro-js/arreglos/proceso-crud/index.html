<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./index.css">
    <title>Document</title>
</head>
<body>
    <header>
        <nav>
            <h2>Aplicativo CRUD - Ricardo Guevara</h2>
        </nav>
    </header>
    <section>
        <h2>Mi lista de contactos</h2>
        <form id="crearContacto">
            <label>Nombre:</label>
            <input type='text' id="nombre" required/>
            <label>Teléfono:</label>
            <input type="number" id="telefono" required/>
            <label>Correo:</label>
            <input type="email" id="correo" required/>
            <label>Dirección:</label>
            <input type='text' id="direccion" required/>
            <label>Código postal</label>
            <input type="number" id="zip" required/>
            <button>Agregar contacto</button>
        </form>
        <ul id="listaContactos"></ul>
    </section>
    <!--<button id="crearContacto">Agregar contacto</button>

    <button id="eliminarContacto">Eliminar contacto</button>-->
    <script src="./index.js"></script>
</body>
</html>
